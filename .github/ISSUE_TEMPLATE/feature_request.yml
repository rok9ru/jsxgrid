name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part does this concern?
      options:
        - Core engine
        - Native fields
        - Extra fields (Xcheckbox, Xselect, ...)
        - Build / tooling
        - Documentation
        - Something new
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: Desired feature
      description: What should jsxgrid do that it doesn't today?
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Justification / use case
      description: What are you trying to build, and why doesn't the current API cover it?
    validations:
      required: true
